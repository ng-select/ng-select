name: Release

on:
  push:
    branches:
      - master

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: write # Required for semantic-release to push tags/commits

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Copy README
        run: cp README.md ./dist/ng-select/

      - name: Semantic release
        run: npx semantic-release

      - name: publish @ng-select/ng-option-highlight
        # semantic-release only publishes @ng-select/ng-select (pkgRoot dist/ng-select).
        # It stamps the new version into dist/ng-select/package.json only when it actually
        # releases, so publish the highlight package only when that version is live on npm
        # and the highlight package doesn't have it yet.
        run: |
          VERSION=$(jq -r .version ./dist/ng-select/package.json)

          if [ "$(npm view @ng-select/ng-select version)" != "$VERSION" ]; then
            echo "No new @ng-select/ng-select release this run (dist has $VERSION); skipping publish."
            exit 0
          fi

          if npm view "@ng-select/ng-option-highlight@$VERSION" version >/dev/null 2>&1; then
            echo "@ng-select/ng-option-highlight@$VERSION already published; skipping."
            exit 0
          fi

          TEMPFILE=$(mktemp)
          jq ".version = \"$VERSION\"" ./dist/ng-option-highlight/package.json > "$TEMPFILE"
          mv "$TEMPFILE" ./dist/ng-option-highlight/package.json

          pnpm publish ./dist/ng-option-highlight --no-git-checks --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build demo
        run: pnpm build:demo

      - name: Deploy demo 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: dist/demo/browser
